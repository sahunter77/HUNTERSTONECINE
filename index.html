<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUNTER STONE CINE 🎬</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0a1929; color: #fff; min-height: 100vh; }
        
        header {
            padding: 1.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(79,195,247,0.2);
        }
        
        .logo {
            font-size: 1.8rem;
            color: #4fc3f7;
            font-weight: bold;
        }
        
        .search-box {
            max-width: 500px;
            margin: 1rem auto;
        }
        
        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 25px;
            border: 1px solid #4fc3f7;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
        }
        
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            padding: 1rem;
        }
        
        .filter-btn {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: none;
            background: rgba(79,195,247,0.2);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-btn.active, .filter-btn:hover {
            background: #4fc3f7;
            color: #000;
        }
        
        h2 {
            text-align: center;
            padding: 1rem;
            color: #81d4fa;
        }
        
        .movies-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.5rem;
        }
        
        .movie-card {
            background: rgba(30,30,30,0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(79,195,247,0.1);
            transition: transform 0.3s;
        }
        
        .movie-card:hover {
            transform: translateY(-5px);
            border-color: #4fc3f7;
        }
        
        .movie-poster {
            width: 100%;
            height: 240px;
            background: #1e3a5f;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .movie-info {
            padding: 0.8rem;
        }
        
        .movie-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }
        
        .movie-type {
            font-size: 0.8rem;
            color: #4fc3f7;
        }
        
        footer {
            text-align: center;
            padding: 2rem;
            color: #5a7a96;
            margin-top: 2rem;
        }
        
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: #888;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="logo">🎬 HUNTER STONE CINE</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Pesquise um filme...">
        </div>
    </header>

    <h2 id="sectionTitle">🔥 Todos os Títulos</h2>
    
    <div class="filters">
        <button class="filter-btn active" onclick="mostrarTodos()">Todos</button>
        <button class="filter-btn" onclick="filtrarPor('Filme')">🎬 Filmes</button>
        <button class="filter-btn" onclick="filtrarPor('Série')">📺 Séries</button>
        <button class="filter-btn" onclick="filtrarPor('Dorama')">🌸 Doramas</button>
        <button class="filter-btn" onclick="filtrarPor('Desenho')">🎨 Desenhos</button>
    </div>

    <div class="movies-container" id="moviesContainer">
        <!-- Os filmes vão aparecer aqui -->
    </div>

    <footer>
        <p>© 2026 HUNTER STONE CINE — Todos os direitos reservados 🎬</p>
    </footer>

    <script>
        const catalogo = [
            { titulo: "Interestelar", tipo: "Filme", capa: "https://image.tmdb.org/t/p/w342/rAiYTfKGqDCRIIqo664sY9XZIvQ.jpg" },
            { titulo: "John Wick", tipo: "Filme", capa: "https://image.tmdb.org/t/p/w342/7gKIjtMMeW5ZVUA14WzN2nmFz7o.jpg" },
            { titulo: "Coringa", tipo: "Filme", capa: "https://image.tmdb.org/t/p/w342/udDclJoHjfjb9lDjskNwoz7YkAC.jpg" },
            { titulo: "Stranger Things", tipo: "Série", capa: "https://image.tmdb.org/t/p/w342/49WJfeN0moxb9IPfGn8AIqMGskD.jpg" },
            { titulo: "Round 6", tipo: "Série", capa: "https://image.tmdb.org/t/p/w342/dDlEmu3EZ0Pgg93K2SVNLCjCSvE.jpg" },
            { titulo: "La Casa de Papel", tipo: "Série", capa: "https://image.tmdb.org/t/p/w342/reEMJA1uzscCbkpeRJeTT2bjqAg.jpg" },
            { titulo: "Pousando no Amor", tipo: "Dorama", capa: "https://image.tmdb.org/t/p/w342/ok7O70zqKq9m9vYj3XzWbQ9uQ0b.jpg" },
            { titulo: "Rainha das Lágrimas", tipo: "Dorama", capa: "https://image.tmdb.org/t/p/w342/6zX9z0zqKq9m9vYj3XzWbQ9uQ0b.jpg" },
            { titulo: "Naruto", tipo: "Desenho", capa: "https://image.tmdb.org/t/p/w342/6uOvgoYNPLdvxziD6VqUaWXWXUo.jpg" },
            { titulo: "Dragon Ball Z", tipo: "Desenho", capa: "https://image.tmdb.org/t/p/w342/7gKIjtMMeW5ZVUA14WzN2nmFz7o.jpg" },
            { titulo: "One Piece", tipo: "Desenho", capa: "https://image.tmdb.org/t/p/w342/9O0H3M8xQZ9uYj3K5XzWbQ9uQ0b.jpg" },
            { titulo: "Shrek", tipo: "Desenho", capa: "https://image.tmdb.org/t/p/w342/mv99uHdIhlXvsvd5tB5YdPwQ0Qk.jpg" },
            { titulo: "Avatar: O Caminho da Água", tipo: "Filme", capa: "https://image.tmdb.org/t/p/w342/9uOETcuFwbk5RYh4cFf3OBdCwfW.jpg" },
            { titulo: "Homem de Ferro", tipo: "Filme", capa: "https://image.tmdb.org/t/p/w342/8uO0gUM8aNqYLs1OsTBQiXu0fEv.jpg" },
            { titulo: "Breaking Bad", tipo: "Série", capa: "https://image.tmdb.org/t/p/w342/ggFHVcm0VpWyM9CZvL3YxJ9XoGK.jpg" },
            { titulo: "Uma Advogada Extraordinária", tipo: "Dorama", capa: "https://image.tmdb.org/t/p/w342/9uX9z0zqKq9m9vYj3XzWbQ9uQ0b.jpg" },
            { titulo: "Frozen", tipo: "Desenho", capa: "https://image.tmdb.org/t/p/w342/9uOETcuFwbk5RYh4cFf3OBdCwfW.jpg" },
            { titulo: "Toy Story", tipo: "Desenho", capa: "https://image.tmdb.org/t/p/w342/8uO0gUM8aNqYLs1OsTBQiXu0fEv.jpg" }
        ];

        function mostrarCatalogo(lista) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';
            
            if (lista.length === 0) {
                container.innerHTML = '<p class="no-results">Nenhum título encontrado 😔</p>';
                return;
            }
            
            lista.forEach(item => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="movie-poster">
                        <img src="${item.capa}" alt="${item.titulo}" onerror="this.src='https://via.placeholder.com/300x450/1e3a5f/ffffff?text=${encodeURIComponent(item.titulo)}'">
                    </div>
                    <div class="movie-info">
                        <h3 class="movie-title">${item.titulo}</h3>
                        <span class="movie-type">${item.tipo}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function mostrarTodos() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('sectionTitle').textContent = '🔥 Todos os Títulos — ' + catalogo.length + ' itens';
            mostrarCatalogo(catalogo);
        }

        function filtrarPor(tipo) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            const filtrado = catalogo.filter(i => i.tipo === tipo);
            document.getElementById('sectionTitle').textContent = '📂 ' + tipo + 's — ' + filtrado.length + ' títulos';
            mostrarCatalogo(filtrado);
        }

        document.getElementById('searchInput').addEventListener('input', function() {
            const termo = this.value.toLowerCase().trim();
            if (!termo) {
                mostrarCatalogo(catalogo);
                document.getElementById('sectionTitle').textContent = '🔥 Todos os Títulos';
                return;
            }
            const resultado = catalogo.filter(i => i.titulo.toLowerCase().includes(termo));
            document.getElementById('sectionTitle').textContent = '🔍 Buscando: "' + termo + '"';
            mostrarCatalogo(resultado);
        });

        // Carrega tudo quando a página abre
        mostrarCatalogo(catalogo);
    </script>
</body>
</html>
